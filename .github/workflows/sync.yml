name: Docker Tools Sync

on:
  schedule:
    # 每小时运行一次 (cron: 0 */1 * * *)
    - cron: '0 16 */3 * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
        
    - name: 安装依赖
      run: |
        pip install requests
        
    - name: 创建data目录
      run: |
        mkdir -p ./data
        
    - name: 运行同步脚本
      run: |
        python sync.py
        
    - name: 同步到 CNB
      if: success()
      run: |
        # 删除现有的 latest release
        curl -X 'DELETE' 'https://api.cnb.cool/xkand/tools' -H 'accept: application/json' -H 'Authorization: ${{ secrets.CNB_TOKEN }}'
        sleep 10
        curl -X POST 'https://api.cnb.cool/xkand/-/repos' -H 'Authorization: ${{ secrets.CNB_TOKEN }}' -H 'Content-Type: application/json' -d '{"description": "DockerDeskTop", "license": "MIT", "name": "tools", "visibility": "public"}'
        sleep 15
        cd data
        touch .gitattributes
        echo "*.asar filter=lfs diff=lfs merge=lfs -text" > .gitattributes
        echo "*.msi filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
        echo "*.wsl filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
        echo "*.exe filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
        echo "*.zip filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
        echo "*.dmg filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
        echo "*.AppxBundle filter=lfs diff=lfs merge=lfs -text" >> .gitattributes
        rm -rf .git
        git lfs install
        git init -b main
        git config --local user.name cnb.aslCnwswAEA
        git config --local user.email 'qRw6UksXJbHM5N6LWhxLvB+cnb.aslCnwswAEA@noreply.cnb.cool'
        git add .
        git commit -m "upload"
        git remote add origin https://cnb:${{ secrets.CNB_TOKEN }}@cnb.cool/xkand/tools
        git push -f origin main
        rm -rf .git
        cd ..
      env:
        GITHUB_TOKEN: ${{ secrets.CNB_TOKEN }}

    - name: 彻底删除所有 latest Release 和 Tag
      if: success()
      run: |
        # ==============================================
        # 1. 找到 所有 名称为 latest 的 release 并全部删除
        # ==============================================
        echo "查找所有名为 latest 的 release..."
        RELEASE_IDS=$(gh api repos/:owner/:repo/releases --jq '.[] | select(.tag_name=="latest") | .id')
    
        if [ -n "$RELEASE_IDS" ]; then
          echo "找到旧的 latest release，开始删除..."
          for ID in $RELEASE_IDS; do
            echo "删除 release ID: $ID"
            gh api --method DELETE repos/:owner/:repo/releases/$ID
          done
        else
          echo "没有找到 latest release，跳过删除"
        fi
    
        # ==============================================
        # 2. 强制删除本地和远程的 latest tag（不管是否存在）
        # ==============================================
        echo "删除 latest tag（本地 + 远程）..."
        git tag -d latest 2>/dev/null || true
        git push origin --delete latest 2>/dev/null || true
    
        echo "✅ 所有 latest 相关数据已彻底清空"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: |
          data/**
        tag_name: latest
        name: Docker Tools Latest
        body: |
          ## Docker Tools 最新版本
          
          ### 说明:
          自动从官方仓库同步的最新 Docker 相关工具。
          
          **注意**: 这是一个自动更新的 Release，每次发现新版本时会自动替换文件。
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
